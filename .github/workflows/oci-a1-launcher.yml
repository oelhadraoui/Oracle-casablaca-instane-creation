name: oci-a1-launcher

on:
  schedule:
    - cron: "0 */6 * * *"     # start a new ~5.5h run every 6 hours
  workflow_dispatch:           # "Run workflow" button for the first start

concurrency:
  group: oci-a1
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" | tr -d '\r' > ~/.oci/key.pem
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY"
            echo "region=af-casablanca-1"
            echo "key_file=$HOME/.oci/key.pem"
          } > ~/.oci/config
          chmod 600 ~/.oci/key.pem ~/.oci/config

      - name: Test OCI login
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: oci iam availability-domain list --query 'data[0].name' --raw-output

      - name: Try to launch A1 instance
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          MAX_MINUTES: "330"
          SLEEP: "90"
        run: |
          sed -i 's/\r$//' launch_a1.sh    # fix Windows line endings
          bash launch_a1.sh